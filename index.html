
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Música Altimiras</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0969da">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
  :root{
    --fondo:#111018;
    --fondo-fila:#1b1926;
    --fondo-fila-activa:#232037;
    --borde:#312e45;
    --texto:#f1eef9;
    --texto-tenue:#918cae;
    --violeta:#8b5cf6;
    --rosa:#ec4899;
    --cian:#22d3ee;
    --naranja:#fb923c;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 85% 0%, rgba(139,92,246,0.18) 0%, transparent 45%),
      radial-gradient(circle at 10% 15%, rgba(236,72,153,0.14) 0%, transparent 40%),
      var(--fondo);
    color:var(--texto);
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    min-height:100vh;
  }

  /* ---------- Cinta superior ---------- */
  .cinta{
    position:relative;
    padding:20px 18px;
    background:linear-gradient(100deg, #6d28d9 0%, #a21caf 32%, #db2777 58%, #f97316 100%);
    background-size:220% 220%;
    animation:mover-cinta 12s ease infinite;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:12px;
  }
  @keyframes mover-cinta{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .cinta::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 100%);
  }
  .cinta h1{
    position:relative;
    margin:0;
    font-size:1.4rem;
    font-weight:800;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cinta h1 .nota{ font-size:1.2rem; }
  .boton-atras{
    position:relative;
    width:34px; height:34px; flex-shrink:0;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .boton-atras svg{ width:18px; height:18px; fill:#fff; }
  .boton-atras.oculto{ display:none; }

  #estado{ padding:16px 20px; color:var(--texto-tenue); font-size:0.9rem; }
  #estado.error{color:#f87171;}
  #vacio{ padding:40px 20px; text-align:center; color:var(--texto-tenue); font-size:0.9rem; line-height:1.6; }
  code{ background:#211f30; padding:1px 6px; border-radius:4px; color:var(--cian); }

  /* ---------- Vista géneros (cuadrícula) ---------- */
  #vista-generos{ padding:8px 16px 30px; }
  #rejilla-generos{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(130px,1fr));
    gap:16px;
    margin-top:8px;
  }
  .tarjeta-genero{
    background:var(--fondo-fila);
    border:1px solid var(--borde);
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .tarjeta-genero:active{ transform:scale(0.96); }
  .tarjeta-genero:hover{ border-color:var(--violeta); }
  .icono-genero-wrap{
    width:100%; aspect-ratio:1/1;
    background:linear-gradient(135deg, #2a2740, #191725);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .icono-genero-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .icono-genero-wrap .emoji{ font-size:2.4rem; }
  .tarjeta-genero .nombre-genero{
    padding:10px 10px 12px;
    font-size:0.92rem; font-weight:700;
    text-align:center;
  }

  /* ---------- Vista lista de canciones ---------- */
  #vista-lista{ display:none; padding-bottom:20px; }
  #lista{ display:flex; flex-direction:column; padding:10px 14px 20px; gap:4px; }

  .fila{
    display:flex; align-items:center; gap:14px;
    padding:10px 10px; border-radius:14px; cursor:pointer;
    border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .fila:active{ transform:scale(0.985); background:var(--fondo-fila); }

  .caratula-wrap{
    position:relative; width:60px; height:60px; border-radius:10px;
    overflow:hidden; background:linear-gradient(135deg, #2a2740, #191725); flex-shrink:0;
  }
  .caratula-wrap img{ width:100%;height:100%;object-fit:cover;display:block; }
  .caratula-wrap .sin-caratula{
    width:100%;height:100%; display:flex;align-items:center;justify-content:center;
    color:var(--texto-tenue); font-size:1.4rem;
  }
  .marca-play{
    position:absolute; right:3px;bottom:3px; width:20px;height:20px; border-radius:50%;
    background:linear-gradient(135deg, var(--rosa), var(--naranja));
    display:flex;align-items:center;justify-content:center;
  }
  .marca-play svg{width:10px;height:10px;fill:#fff;}

  .fila .info{ min-width:0; flex:1; }
  .fila .titulo{
    font-size:0.98rem; font-weight:600; line-height:1.3; margin:0; color:var(--texto);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .fila .autor{
    margin:3px 0 0; font-size:0.78rem; color:var(--texto-tenue);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ---------- Vista reproductor a pantalla completa ---------- */
  #vista-reproductor{
    display:none;
    position:fixed; inset:0;
    background:var(--fondo);
    z-index:50;
    flex-direction:column;
    overflow-y:auto;
  }
  .reproductor-cabecera{
    display:flex; align-items:center; gap:12px;
    padding:16px 16px 0;
  }
  .caratula-marco{
    height:50vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px 30px 10px;
  }
  .caratula-marco .marco-interior{
    width:100%; height:100%; max-width:380px;
    border-radius:20px;
    overflow:hidden;
    background:linear-gradient(135deg, #2a2740, #191725);
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
  }
  .caratula-marco img{ width:100%; height:100%; object-fit:cover; }
  .caratula-marco .emoji{ font-size:4rem; }

  .info-reproductor{ text-align:center; padding:6px 24px 0; }
  .info-reproductor .titulo-grande{
    font-size:1.3rem; font-weight:800; margin:0;
    background:linear-gradient(90deg, var(--cian), var(--violeta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .info-reproductor .autor-grande{
    margin:6px 0 0; font-size:0.95rem; color:var(--texto-tenue);
  }

  .controles-audio{ padding:24px 24px 0; }
  .controles-audio audio{ width:100%; height:40px; }

  .boton-volver-menu{
    margin:26px 24px 30px;
    padding:14px;
    border:none;
    border-radius:14px;
    background:var(--fondo-fila);
    border:1px solid var(--borde);
    color:var(--texto);
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .boton-volver-menu svg{ width:16px; height:16px; fill:var(--texto); }
</style>
</head>
<body>

<div class="cinta">
  <button class="boton-atras oculto" id="btn-atras-cinta" aria-label="Volver">
    <svg viewBox="0 0 24 24"><path d="M15.5 19L8.5 12l7-7 1.4 1.4L11.3 12l5.6 5.6z"/></svg>
  </button>
  <h1><span class="nota">🎵</span><span id="titulo-cinta">Música Altimiras</span></h1>
</div>

<div id="estado">Cargando…</div>
<div id="vacio" style="display:none;"></div>

<!-- VISTA 1: géneros -->
<div id="vista-generos">
  <div id="rejilla-generos"></div>
</div>

<!-- VISTA 2: lista de canciones de un género -->
<div id="vista-lista">
  <div id="lista"></div>
</div>

<!-- VISTA 3: reproductor a pantalla completa -->
<div id="vista-reproductor">
  <div class="caratula-marco">
    <div class="marco-interior" id="rep-marco">
      <div class="emoji">🎵</div>
    </div>
  </div>
  <div class="info-reproductor">
    <p class="titulo-grande" id="rep-titulo">—</p>
    <p class="autor-grande" id="rep-autor"></p>
  </div>
  <div class="controles-audio">
    <audio id="rep-audio" controls preload="metadata"></audio>
  </div>
  <button class="boton-volver-menu" id="btn-volver-lista">
    <svg viewBox="0 0 24 24"><path d="M15.5 19L8.5 12l7-7 1.4 1.4L11.3 12l5.6 5.6z"/></svg>
    Volver al menú
  </button>
</div>

<script>
const RAMA_POR_DEFECTO = "main";
const CARPETA_MP3 = "mp3";
const EXT_IMAGEN = ["jpg","jpeg","png","webp","gif"];

let GENEROS = {}; // { nombreGenero: {icono: url|null, canciones:[...]} }
let GENERO_ACTUAL = null;

function obtenerConfiguracion(){
  const host = location.hostname;
  const partesRuta = location.pathname.split("/").filter(Boolean);
  const usuario = host.split(".")[0];
  const repositorio = partesRuta.length > 0 ? partesRuta[0] : host;
  return {usuario, repositorio, rama: RAMA_POR_DEFECTO, carpetaMp3: CARPETA_MP3};
}

function tituloDesdeArchivo(nombreArchivo){
  const sinExt = nombreArchivo.substring(0, nombreArchivo.lastIndexOf(".")) || nombreArchivo;
  return sinExt.replace(/[_\-]+/g," ").trim().replace(/\b\w/g, l => l.toUpperCase());
}

function nombreGenero(carpeta){
  return carpeta.replace(/[_\-]+/g," ").trim().replace(/\b\w/g, l => l.toUpperCase());
}

async function cargarCancionero(){
  const cfg = obtenerConfiguracion();
  const estado = document.getElementById("estado");

  try{
    const urlArbol = `https://api.github.com/repos/${cfg.usuario}/${cfg.repositorio}/git/trees/${cfg.rama}?recursive=1`;
    const resp = await fetch(urlArbol);
    if(!resp.ok){
      throw new Error(resp.status === 404
        ? "No se encontró el repositorio o la rama indicada."
        : `Error de GitHub (${resp.status}).`);
    }
    const datos = await resp.json();
    const items = datos.tree || [];
    const base = `https://raw.githubusercontent.com/${cfg.usuario}/${cfg.repositorio}/${cfg.rama}/`;

    GENEROS = {};

    items.filter(i => i.type === "blob" && i.path.startsWith(cfg.carpetaMp3 + "/"))
      .forEach(item => {
        const partes = item.path.split("/"); // ["mp3", "Genero", "archivo.ext"]  o ["mp3","archivo.mp3"]
        let genero, archivo;
        if(partes.length >= 3){
          genero = partes[1];
          archivo = partes[partes.length - 1];
        } else if(partes.length === 2){
          genero = "General";
          archivo = partes[1];
        } else {
          return;
        }

        if(!GENEROS[genero]) GENEROS[genero] = {icono:null, iconoNombre:null, canciones:[]};

        const ext = archivo.split(".").pop().toLowerCase();
        if(ext === "mp3"){
          GENEROS[genero].canciones.push({
            ruta:item.path,
            titulo: tituloDesdeArchivo(archivo),
            artista:"",
            urlAudio: base + item.path,
            urlCaratula:null
          });
        } else if(EXT_IMAGEN.includes(ext)){
          const baseSinExt = archivo.substring(0, archivo.lastIndexOf(".")).toLowerCase();
          const esPreferida = baseSinExt === "icono" || baseSinExt === "icon" || baseSinExt === "portada";
          if(!GENEROS[genero].icono || esPreferida){
            GENEROS[genero].icono = base + item.path;
            GENEROS[genero].iconoNombre = baseSinExt;
          }
        }
      });

    // Limpia géneros que quedaron sin ninguna canción (solo imágenes sueltas)
    Object.keys(GENEROS).forEach(g => { if(GENEROS[g].canciones.length === 0) delete GENEROS[g]; });

    if(Object.keys(GENEROS).length === 0){
      estado.style.display = "none";
      const vacio = document.getElementById("vacio");
      vacio.style.display = "block";
      vacio.innerHTML = `Aún no hay canciones.<br>Organiza tus mp3 en carpetas por género dentro de <code>${cfg.carpetaMp3}/</code>.`;
      return;
    }

    estado.style.display = "none";
    renderizarGeneros();

  }catch(err){
    estado.textContent = "No se pudo cargar el cancionero: " + err.message;
    estado.classList.add("error");
  }
}

/* ---------------- Navegación entre vistas ---------------- */
function mostrarVista(nombre){
  document.getElementById("vista-generos").style.display = nombre === "generos" ? "block" : "none";
  document.getElementById("vista-lista").style.display = nombre === "lista" ? "block" : "none";
  document.getElementById("vista-reproductor").style.display = nombre === "reproductor" ? "flex" : "none";
  document.getElementById("btn-atras-cinta").classList.toggle("oculto", nombre === "generos");

  if(nombre === "generos"){
    document.getElementById("titulo-cinta").textContent = "Música Altimiras";
  }
}

document.getElementById("btn-atras-cinta").addEventListener("click", () => {
  if(document.getElementById("vista-lista").style.display === "block"){
    mostrarVista("generos");
  }
});

document.getElementById("btn-volver-lista").addEventListener("click", () => {
  document.getElementById("rep-audio").pause();
  document.getElementById("titulo-cinta").textContent = nombreGenero(GENERO_ACTUAL || "");
  mostrarVista("lista");
});

/* ---------------- Vista géneros ---------------- */
function renderizarGeneros(){
  const rejilla = document.getElementById("rejilla-generos");
  rejilla.innerHTML = "";

  Object.keys(GENEROS).sort((a,b) => a.localeCompare(b,"es")).forEach(genero => {
    const datos = GENEROS[genero];
    const tarjeta = document.createElement("div");
    tarjeta.className = "tarjeta-genero";
    tarjeta.innerHTML = `
      <div class="icono-genero-wrap">
        ${datos.icono ? `<img src="${datos.icono}" alt="${genero}" loading="lazy">` : `<div class="emoji">🎼</div>`}
      </div>
      <div class="nombre-genero">${nombreGenero(genero)}</div>
    `;
    tarjeta.addEventListener("click", () => abrirGenero(genero));
    rejilla.appendChild(tarjeta);
  });

  mostrarVista("generos");
}

function abrirGenero(genero){
  GENERO_ACTUAL = genero;
  document.getElementById("titulo-cinta").textContent = nombreGenero(genero);
  renderizarLista(GENEROS[genero].canciones);
  mostrarVista("lista");
}

/* ---------------- Vista lista de canciones ---------------- */
function renderizarLista(canciones){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  canciones.forEach((cancion, indice) => {
    const fila = document.createElement("div");
    fila.className = "fila";
    fila.innerHTML = `
      <div class="caratula-wrap">
        <div class="sin-caratula">♪</div>
        <div class="marca-play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="info">
        <p class="titulo">${cancion.titulo}</p>
        <p class="autor"></p>
      </div>
    `;
    fila.addEventListener("click", () => abrirReproductor(cancion));
    lista.appendChild(fila);

    leerEtiquetasId3(cancion, fila);
  });
}

async function leerEtiquetasId3(cancion, fila){
  if(typeof jsmediatags === "undefined") return;

  try{
    const respuesta = await fetch(cancion.urlAudio);
    if(!respuesta.ok) throw new Error("No se pudo descargar el mp3");
    const blob = await respuesta.blob();

    jsmediatags.read(blob, {
      onSuccess: function(tag){
        const t = tag.tags || {};

        if(t.title){
          cancion.titulo = t.title;
          fila.querySelector(".titulo").textContent = t.title;
        }
        if(t.artist){
          cancion.artista = t.artist;
          fila.querySelector(".autor").textContent = t.artist;
        }
        if(t.picture){
          const {data, format} = t.picture;
          let urlImagen = null;

          if(format === "-->"){
            urlImagen = new TextDecoder("utf-8").decode(new Uint8Array(data)).trim();
          } else if(data && data.length){
            const bytes = new Uint8Array(data);
            const blobImagen = new Blob([bytes], {type: format || "image/jpeg"});
            urlImagen = URL.createObjectURL(blobImagen);
          }

          if(urlImagen){
            cancion.urlCaratula = urlImagen;
            const envoltorio = fila.querySelector(".caratula-wrap");
            const img = document.createElement("img");
            img.alt = cancion.titulo;
            img.referrerPolicy = "no-referrer";
            img.onload = () => {
              const marcador = envoltorio.querySelector(".sin-caratula");
              if(marcador) marcador.remove();
              void envoltorio.offsetHeight;
            };
            img.onerror = () => { img.remove(); };
            envoltorio.prepend(img);
            img.src = urlImagen;
          }
        }
      },
      onError: function(error){
        console.warn("Sin etiquetas ID3 legibles en", cancion.ruta, error);
      }
    });
  }catch(err){
    console.warn("No se pudieron leer etiquetas de", cancion.ruta, err);
  }
}

/* ---------------- Vista reproductor ---------------- */
function abrirReproductor(cancion){
  const marco = document.getElementById("rep-marco");
  const titulo = document.getElementById("rep-titulo");
  const autor = document.getElementById("rep-autor");
  const audio = document.getElementById("rep-audio");

  titulo.textContent = cancion.titulo;
  autor.textContent = cancion.artista || "";

  const urlPortada = cancion.urlCaratula || (GENEROS[GENERO_ACTUAL] && GENEROS[GENERO_ACTUAL].icono);
  marco.innerHTML = urlPortada
    ? `<img src="${urlPortada}" alt="${cancion.titulo}">`
    : `<div class="emoji">🎵</div>`;

  audio.src = cancion.urlAudio;
  mostrarVista("reproductor");
  audio.play().catch(()=>{ /* el navegador puede requerir un toque previo */ });
}

cargarCancionero();
</script>

</body>
</html>
